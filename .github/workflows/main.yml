name: Ahly Tickets Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "ابعت رسالة Telegram تجريبية بس"
        type: boolean
        default: false
      debug:
        description: "احفظ نص الصفحة وصورتها للفحص"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ahly-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MATCH_URL: ${{ vars.MATCH_URL }}
      MATCH_NAME: ${{ vars.MATCH_NAME }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BOOK_SELECTOR: ${{ vars.BOOK_SELECTOR }}
      DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test Telegram only
        if: ${{ github.event.inputs.test_telegram == 'true' }}
        run: python monitor.py --test

      - name: Check tickets
        if: ${{ github.event.inputs.test_telegram != 'true' }}
        run: python monitor.py

      - name: Upload debug files
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/

      - name: Save state
        if: ${{ github.event.inputs.test_telegram != 'true' }}
        run: |
          git config user.name "ahly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
