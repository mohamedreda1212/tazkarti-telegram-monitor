name: Tazkarti Telegram Monitor

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a test Telegram message"
        required: false
        type: boolean
        default: false

      debug:
        description: "Run monitor in debug mode"
        required: false
        type: boolean
        default: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Test Telegram
        if: ${{ inputs.test_telegram }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TG_BOT_TOKEN"]
          chat_id = os.environ["TG_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "✅ اختبار Telegram ناجح!\nالبوت شغال بشكل صحيح."
          }).encode()

          request = urllib.request.Request(url, data=data)

          with urllib.request.urlopen(request, timeout=30) as response:
              result = response.read().decode()
              print(result)
          PY

      - name: Run monitor - Debug
        if: ${{ inputs.debug }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MATCH_URL: ${{ vars.MATCH_URL }}
        run: |
          python monitor.py --debug

      - name: Run monitor
        if: ${{ !inputs.test_telegram && !inputs.debug }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MATCH_URL: ${{ vars.MATCH_URL }}
        run: |
          python monitor.py
